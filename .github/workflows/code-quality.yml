name: Code quality (no image build)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Check dependency lock and published advisories
        run: |
          uv lock --check
          uv audit --locked
      - name: Check for high-confidence committed secrets
        run: |
          if git grep -n -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{32,}' -- .; then
            echo "Potential committed secret detected" >&2
            exit 1
          fi
      - name: Install locked runtime and test runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1 poppler-utils tesseract-ocr
          uv python install 3.11
          uv sync --python 3.11 --locked
          uv pip install --python .venv/bin/python 'pytest==9.1.1'
      - name: Check syntax and CPU test suite
        env:
          PADDLE_USE_GPU: "false"
          PYTHONPATH: src
        run: |
          .venv/bin/python -m compileall -q src scripts
          .venv/bin/python -m pytest -q

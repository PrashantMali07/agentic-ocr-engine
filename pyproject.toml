[project]
name = "ingestion-pipeline"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prashant K Mali", email = "er.prashantkmrmali@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "urllib3>=2.8.0,<3",
    "lxml>=6.1.3",
    "paddleocr>=2.8.0",
    "paddleocr[doc-parser]>=3.0",
    "paddlex>=3.0.0",
    "paddlepaddle-gpu>=3.0.0b2",
    "pdfplumber==0.11.10",
    "pymupdf==1.28.2",
    "pymupdf-layout>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "starlette>=1.6.0",
    "tabulate>=0.10.0",
    "uvicorn>=0.52.4",
    "langdetect>=1.0.9",
    "python-dotenv>=1.2.3",
    "openpyxl>=3.1.5",
    "aiosqlite>=0.22.1",
    "msoffcrypto-tool>=6.0.0",
    "xlrd<2.0",
    "charset-normalizer>=3.5.1",
    "pytesseract>=0.3.13",
    "onnxruntime>=1.26.0",
    "transformers>=5.19.0",
    "torch>=2.0.0",
    "langgraph>=1.2.14",
    "temporalio>=1.34.0",
]

[project.scripts]
ingest-pipeline = "ingestion_pipeline.main:main"
ingest-validate = "ingestion_pipeline.processing.validation:main"
ingest-extract-fields = "ingestion_pipeline.processing.fields:main"
ingest-api = "ingestion_pipeline.api:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "paddle-cu123"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu123/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu123" }
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["test_asset"]

[tool.ruff.lint]
# Start with the correctness-focused rulesets; widen later.
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # line length is enforced separately where it matters
    # FastAPI dependency injection requires calls in parameter defaults
    # (Depends(...), File(...)); converting every endpoint to Annotated
    # would be churn without safety gain. See ruff's B008 guidance for
    # FastAPI projects.
    "B008",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Start strict only on the modules the lane boundary depends on; widen later.
strict = false
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "ingestion_pipeline.contracts.*",
    "ingestion_pipeline.storage.*",
    "ingestion_pipeline.temporal.*",
]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]
